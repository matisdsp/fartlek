          - paragraph [ref=e215]:
            - text: Conçue pour enchaîner les kilomètres avec fluidité, la
            - strong [ref=e216]: ASICS Superblast 3
            - text: combine
            - strong [ref=e217]: amorti
            - text: ","
            - strong [ref=e218]: stabilité
            - text: et un excellent
            - strong [ref=e219]: retour d’énergie
            - text: pour accompagner les coureurs sur leurs sorties longues comme en compétition. Inscrivez-vous à notre
            - link "newsletter" [ref=e220] [cursor=pointer]:
              - /url: /enregistrement/newsletter.html
            - text: pour rester informé de nos nouveautés et choisir la chaussure idéale pour vos entraînements.
          - heading "Pourquoi choisir la ASICS Superblast 3 ?" [level=2] [ref=e221]
          - paragraph [ref=e222]:
            - text: La
            - strong [ref=e223]: Superblast 3
            - text: "est une chaussure pensée pour aller plus loin, plus longtemps et avec moins de fatigue :"
          - list [ref=e224]:
            - listitem [ref=e225]:
              - strong [ref=e226]: Semelle intermédiaire à double mousse
              - text: ": elle absorbe efficacement les chocs à chaque impact tout en restituant l’énergie nécessaire pour conserver une foulée fluide et dynamique."
            - listitem [ref=e227]:
              - strong [ref=e228]: Tige en mesh technique, légère et respirante
              - text: ": elle maintient le pied sans le comprimer et favorise la circulation de l’air, ce qui limite la surchauffe et améliore le confort sur les sorties longues."
            - listitem [ref=e229]:
              - strong [ref=e230]: Languette fine et légèrement rembourrée
              - text: ": elle réduit les points de pression sur le dessus du pied et permet un laçage confortable, sans gêne ni irritation."
            - listitem [ref=e231]:
              - strong [ref=e232]: Stabilité renforcée sur la durée
              - text: ": la plateforme large et bien équilibrée sécurise chaque foulée, ce qui aide à conserver une bonne posture et à limiter la fatigue musculaire en fin de course."
            - listitem [ref=e233]:
              - strong [ref=e234]: Semelle extérieure adhérente
              - text: ": elle garantit une accroche fiable sur route, même lorsque le rythme augmente ou que le revêtement devient plus exigeant, pour courir en toute confiance."
