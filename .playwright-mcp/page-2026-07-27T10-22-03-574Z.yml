                            - generic [ref=e2981]: Chaussure maxi, un peu large de semelle, plus stable qu'une novablast 5, mais pas forcément plus dynamique (pas ressenti d'effet rebond particulier). Elle convient à plusieurs allures, sans doute bien adaptée pour du long car protectrice des articulations. Course sur route et petits chemins (pas testée sur route humide). Le laçage est bien car il permet un bon ajustement. Maintien du talon ok, il n'y a pas de gène au tendon d’achille. Il faut quelques dizaines de km de rodage. 4 étoiles car pas toujours superfan des mousses maximalistes et du prix au delà du raisonnable malgré les remises.
