                        - generic [ref=e2823]:
                          - generic [ref=e2824]: "[This review was collected as part of a promotion.] I bought the SB3 expecting a lively and relatively \"fast\" shoe for slower tempos up to long runs. It has a good fit and it looks good but.... it has to be the slowest shoe I have tried for a long time. Running in it feels as if I have two boats that sink in mud. The shoe is extremely soft, it is so soft that you feel that you sink in the abyss and the only thing that you find there is an empty wallet. No monsters, no nothing. Any further sinking and it would have been a black hole. So, no. The Superblast has no super feel. It has super looks and super price. I also have the Sonicblast and MagicSpeed 4. Far superior shoes for me."
