                      - generic [ref=e2902]:
                        - generic [ref=e2903]: Ich habe ziemlich viele Max Stack, Max Cushion Laufschuhe und muss sagen, dass der Superblast 3 mein absoluter Favorit ist. Bei keinem Laufschuh hatte ich bis jetzt das Gefühl, dass ich z.b. nach einem Long Run nach Hause komme und sich meine Beine anfühlen, als hätte ich überhaupt nicht trainiert. Der Schuh ist unglaublich bequem, gleichzeitig super stabil und das Tempo kann man auch ohne Probleme erhöhen durch den FF Leap Foam. Wird definitiv nicht mein letzter Superblast sein. Der Grip ist übrigens auch überragend und der Schuh ist sehr leicht, wenn man bedenkt, wie viel Foam unter der dem Fuß ist. Ganz klare Kaufempfehlung!
