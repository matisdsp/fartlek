                      - generic [ref=e2699]:
                        - generic [ref=e2700]: Na ruim 800 km ervaring op de voorloper (Superblast 2) meteen bij de release de 3 besteld. De schoen is precies geworden wat ik hoopte. Waar de 2 nog een beetje stug of "vierkant" voelt is de 3 gewoon een stuk smoother geworden door de toevoeging van de nieuwe schuimlaag in de zool. Hierbij echter met behoud van de stabiliteit. Ik gebruik ze in de roulatie als schoenen voor lange relatief rustige duurlopen naast de Megablast voor intervallen en tempo trainingen. Voor wedstrijden en intensieve tempo's gebruik ik de Metaspeed sky Tokyo. Ze hebben allemaal enige overlap en zorgen er voor dat ik altijd op de juiste schoen aan de start van mijn loop sta.
