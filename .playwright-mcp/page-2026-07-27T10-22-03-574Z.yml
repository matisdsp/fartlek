                        - generic [ref=e3135]: "[Diese Bewertung wurde im Rahmen einer Werbeaktion gesammelt.] Nach ein paar Jahren der Abstinenz ergriff mich die Lust am Laufen mal wieder. Da meine alten GT 2000 zwar erst 300km auf dem Buckel hatten aber schon eine ganze Zeit im Schrank standen, dachte ich total ambitioniert, ich hol gleich mal was Neues. Rein geschlüpft und wohl gefühlt! Meine Größe passte immer noch bei Asics. Anfängliches Gehen mit der großen Dämpfung war schon seltsam aber nicht unangenehm. Selbiges beim ersten 5km Lauf. Seitdem habe ich jetzt mehrere 10km-Läufe hinter mir und bin total begeistert. Der letzte Kilometer „bergab“ (40 HM auf etwa 500) mit der Dämpfung überhaupt kein Problem , die kann man voll angehen ohne sich zurück nehmen zu müssen. Ich wü(e)rde sie wieder kaufen."
