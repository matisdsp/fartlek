                      - generic [ref=e2767]:
                        - generic [ref=e2768]: Der Superblast 3 ist ein sehr gemütlicher Schuh mit einem unglaublich weichen Foam. Als großer Fan des 2er Modells (es war mein präferierter Langstrecken/Halbmarathon Laufschuh) bin ich aber leider etwas enttäuscht, da sich das Gefühl beim Laufen stark unterscheidet. Ich sinke mehr ein und vermisse den Pep, den mir der SB2 geboten hat. Der Schuh ist ohne Zweifel ein guter Schuh der sicherlich vielseitig einsetzbar ist und ich glaube ich werde schon einen Platz in meiner Rotation für ihn finden, aber zurzeit greife ich lieber zum Vorgängermodell. Auf jeden Fall sieht der SB3 fantastisch aus, eines der schönsten Modelle von Asics.
