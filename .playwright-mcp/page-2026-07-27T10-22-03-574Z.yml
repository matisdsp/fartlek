                      - generic [ref=e2631]:
                        - generic [ref=e2632]: "[This review was collected as part of a promotion.] Everyday isn't race day and noticed that my runs all seemed to becoming the same. With this shoe, I now start my watch and dont look at it again until I come to the end of my run. This is not a slow shoe by any means, but the comfort seems to relay to my brain to calm down and not keep pushing and enjoy just being out. I watched a few reviews online and decided to go down by 0.5 in size (from UK11 to UK10.5), this suited me perfectly as have a standard to narrow foot. I never had the SB2, but had the Megablast which does seem faster, but this is not the purpose of the SB3 for me, its for comfort and miles. User: 187cm (6'2\") and 95kg (210lbs)."
