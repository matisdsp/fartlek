              - text: 
            - paragraph [ref=e177]: La SUPERBLAST 3 garantit une foulée ultra-dynamique grâce à ses nouvelles mousses innovantes.
            - paragraph [ref=e178]: La semelle intermédiaire a été améliorée avec une mousse FF LEAP. La composition de la mousse est inspirée des modèles de compétition METASPEED. Légère et réactive, elle est idéale pour les sorties quotidiennes.
            - paragraph [ref=e179]: Une nouvelle capsule à effet trampoline a été stratégiquement intégrée dans la semelle extérieure. Cet élément permet à la semelle d'être très réactive pour une impulsion et une foulée ultra-dynamiques.
            - paragraph [ref=e180]: Détails
            - list [ref=e181]:
              - listitem [ref=e182]: Conçue pour foulée neutre / supination
              - listitem [ref=e183]: "Surface : Route"
              - listitem [ref=e184]: "Amorti : Élevé"
              - listitem [ref=e185]: "Drop : 8 mm"
              - listitem [ref=e186]: "Poids : 239 g"
              - listitem [ref=e187]: "Soutien : Neutre"
              - listitem [ref=e188]: "Largeur : Standard"
              - listitem [ref=e189]: "Tige en maille tissée technique : Un matériau respirant qui garde les pieds au sec."
              - listitem [ref=e190]: "Système d'ajustement de la languette à gousset : Améliore l'ajustement du médio-pied et empêche la languette de glisser."
              - listitem [ref=e191]: "Mousse FF BLAST PLUS : Plus légère que la mousse FF BLAST, la mousse de la semelle intermédiaire offre réactivité et amorti moelleux."
              - listitem [ref=e192]: "Mousse FF LEAP : La plus légère et la plus rebondissante des mousses Asics, qui est 33 % plus légère et 13 % plus réactive que la mousse FF BLAST."
              - listitem [ref=e193]: "Semelle à effet trampoline : Le design du dessous de la semelle favorise un excellent retour d'énergie pour un effet rebond maximal lors de l'impulsion."
              - listitem [ref=e194]: "Détails réfléchissants : Visibilité augmentée grâce à une réflectivité maximale le soir et au petit matin."
              - listitem [ref=e195]: Le procédé de teinture en solution utilisé pour la fabrication de la semelle intérieure réduit la consommation d'eau d'environ 33 % et les émissions de carbone d'environ 45 % par rapport à la méthode de teinture conventionnelle.
