                        - generic [ref=e3083]: "[This review was collected as part of a promotion.] I was so excited for these to be released! The SB2 have been one of my favourite shoes for the last year. I tested them out for a tempo run and was surprised how bouncy they were. Tbh I found them too similar to the Novablast 5 - the softness of the shoes is a little too much and definitely prefer the firmness of the SB2 compared to the 3. This is the same with the Novablasts - I prefer the 4’s over the 5’s. I still love the shoe! But just hope that bring back a bit more of the firmness when the SB4 is launched next year :) Also just a warning - they come up a little bigger than the SB2, so go down half a size."
