        - generic [ref=f94e92]:
          - heading "Click & Collect" [level=3] [ref=f94e93]
          - paragraph
          - paragraph [ref=f94e94]: Vos magasins Foulées mettent en place un nouveau service de Click&Collect pour faciliter vos achats de produits en stock dans votre magasin de proximité. Chaussures, montre GPS, vestes, maillots, shorts... commandez en ligne puis retirez votre commande 2h après en magasin. Simple et efficace pour gagner du temps !
          - paragraph [ref=f94e95]: 1. Vous ajoutez vos articles dans le panier en sélectionnant "Ajouter au panier (stock magasin)" et finalisez votre commande
          - paragraph [ref=f94e96]: 2. Vous allez recevoir un mail de confirmation de commande.
          - paragraph [ref=f94e97]: 3. Votre commande sera préparé sous 2h en magasin, sauf pour les vélos qui nécessite un temps de montage et réglage supplémentaire.
          - paragraph [ref=f94e98]: 4. Rendez-vous en magasin pour récupérer votre commande avec votre carte d'identité.
          - paragraph [ref=f94e99]:
            - text: Le Click & Collect est disponible dans les magasins ayant activé ce service.
            - link "Liste des magasins proposant le service Click & Collect Foulees" [ref=f94e100] [cursor=pointer]:
              - /url: https://foulees.com/Click-Collect
          - text: .
          - paragraph
      - article [ref=f94e101]:
        - generic [ref=f94e104]:
          - heading "Livraison Chronopost" [level=3] [ref=f94e105]
          - paragraph [ref=f94e106]:
            - text: "Avec Chronopost, vous avez le choix entre 2 solutions de livraison et un grand réseau de points de retrait, partout en France métropolitaine et la Corse pour toutes vos commandes en ligne. Bénéficiez du maillage unique permettant de couvrir l’ensemble de la France Métropolitaine. Pour vous assurer la meilleure qualité de service, Chronopost a développé un réseau très dense avec 70 sites en propres et 15 000 points de proximité (12000 bureaux de poste et 3100 points Chrono Relais). Une livraison sûre et très rapide pour les clients souhaitant un délai très court entre l'expédition et la réception de leur colis. Les 2 modes de livraison sont :"
            - strong [ref=f94e107]: A domicile
            - text: Livraison au domicile privé avec dépôt en bureau de poste ou agence Chronopost en cas de présentation infructueuse
            - strong [ref=f94e108]: En point Chrono relais
            - text: Livraison en point Chrono Relais, de très nombreux points mis à votre disposition avec des horaires d’ouverture élargis et un retrait rapide Pour plus d'information sur Chronopost
            - link "cliquez ici" [ref=f94e109] [cursor=pointer]:
              - /url: http://www.chronopost.fr
      - article [ref=f94e110]:
        - generic [ref=f94e113]:
          - heading "Livraison Colissimo" [level=3] [ref=f94e114]
          - paragraph [ref=f94e115]:
            - text: Avec SoColissimo, vous avez le choix entre vous faire livrer à domicile ou en points de retrait, partout en France métropolitaine et la Corse pour toutes commandes en ligne, avec livraison en 48h. SoColissimo :à partir de 5.99€ (offert à partir de 99€ de commande). Pour plus d'information sur SoColissimo
            - link "cliquez ici" [ref=f94e116] [cursor=pointer]:
              - /url: https://www.laposte.fr/colissimo
      - article [ref=f94e117]:
        - generic [ref=f94e120]:
          - heading "Livraison Magasin" [level=3] [ref=f94e121]
          - paragraph [ref=f94e122]:
            - strong [ref=f94e123]: Livraison en magasin offerte pour toutes vos commandes à partir de 30€ !
            - text: Quand vous commandez sur notre site, vous pouvez choisir de vous faire livrer dans l’un des magasins du réseau proposant le service e-commerce au tarif de 3€ (offert à partir de 30€ d'achat). Dès que votre colis est mis à votre disposition vous êtes averti par e-mail et un conseiller vous remet votre colis en magasin. L'occasion de discuter de votre achat avec un spécialiste.
      - article [ref=f94e124]:
        - generic [ref=f94e127]:
          - heading "Paiement 3X ou 4X sans frais" [level=3] [ref=f94e128]
          - paragraph [ref=f94e129]: "Sur notre site, vous pouvez régler vos achats en 3 ou 4 fois sans frais. Offre de crédit en 3 ou 4 fois sans frais (TAEG 0%), par carte bancaire, pour un achat compris entre 90€ et 4000€. Le coût du crédit est pris en charge par votre magasin. Vous disposez d'un droit légal de rétractation. Ce financement n'est pas soumis à la réglementation du crédit à la consommation. Offre valable pour une durée inférieure ou égale à 90 jours. Le premier paiement intervient le jour de l'achat. Sous réserve d'acceptation par le prêteur : CA Consumer Finance dont Sofinco est une marque - SA au capital de 596 485 149€ -1 rue Victor Basch - CS 70001 - 91068 MASSY Cedex RCS Evry 542 097 522. Intermédiaire en assurance inscrit à l'ORIAS sous le numéro 07 008 079 (www.orias.fr). Cette publicité est diffusée par Peloton, (SASU au capital social de 10 000 €, 2 rue du Commandant Cousteau 32600 L’Isle Jourdain) immatriculée au RCS d'Auch sous le numéro 527 712 822, qui est intermédiaire de crédit non exclusif de CA Consumer Finance. Cet intermédiaire apporte son concours à la réalisation d'opérations de crédit à la consommation sans agir en qualité de Prêteur."
      - article [ref=f94e130]:
        - generic [ref=f94e133]:
          - heading "Paiement sécurisé" [level=3] [ref=f94e134]
          - paragraph
          - paragraph [ref=f94e135]: "Nous travaillons en partenariat avec le leader mondial des solutions de paiement Ingenico Payment Services. Toutes les transactions sont authetifiés via la procédure dite 3D-Secure. En cas d'authentification erronée du service 3D-Secure, le paiement ne sera pas confirmé sur votre compte bancaire et la commande ne sera alors pas confirmée. Sur notre site, vous pouvez payer par carte bancaire Carte Bleue, Visa ou MasterCard et via PayPal. ATTENTION, il faut impérativement que votre carte soit Française. Les carte d'origines étrangères ne seront pas acceptées. Les informations qui vous seront demandées lors de votre paiement seront : -le numéro de la carte -la date de validité de la carte -le cryptogramme visuel au dos de la carte -une information complémentaire peut vous être demandée en fonction de votre banque (système 3D-Secure)."
          - paragraph
          - paragraph [ref=f94e136]: Il faut également noter que les paiements qui seront tentés depuis une adresse IP (adresse informatique de votre terminal) hors-France seront refusés.
          - paragraph
      - article [ref=f94e137]:
        - generic [ref=f94e140]:
          - heading "PayPal" [level=3] [ref=f94e141]
          - paragraph [ref=f94e142]: Nous vous proposons en plus des cartes bancaires traditionnelles, le système de paiement PayPal. Au moment de régler votre commande vous aurez le choix entre le paiment par cartes ou PayPal, il vous suffira alors de cliquer sur le logo PayPal et vous serez rediriger vers une page sécurisée gérée par PayPal, nous n'avons jamais accès à vos données bancaires. Grâce à son système de paiement parmi les plus fiables, PayPal effectue vos transactions sans jamais communiquer vos données bancaires aux bénéficiaires, votre adresse email et votre mot de passe suffisent. Il n'est pas nécessaire d'alimenter son compte PayPal à l'avance. La source d'approvisionnement que vous avez choisie (carte de paiement ou compte bancaire) est automatiquement débitée au moment de la transaction. Depuis plus de 10 ans, PayPal est leader des paiements en ligne et sécurise les transactions dans le monde entier. C’est pourquoi 7 millions d’utilisateurs en France font aujourd’hui confiance à PayPal.
      - article [ref=f94e143]:
        - generic [ref=f94e146]:
          - heading "Réseaux" [level=3] [ref=f94e147]
          - paragraph [ref=f94e148]: Un site, des magasins, une expertise de spécialiste - Avec notre site, faites l’expérience d’une nouvelle approche e-running. Nous vous proposons une offre large et complète d’accessoires et d’équipements pour vous et votre pratique. Vous disposez d’un réseau de magasins aux compétences éprouvées pour vous aider et vous accompagner dans votre choix. Une question suite à un problème de taille ou de compatibilité, les magasins du réseau sont à votre disposition pour trouver la meilleure solution.
