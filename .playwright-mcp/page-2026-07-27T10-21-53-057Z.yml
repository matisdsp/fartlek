        - generic [ref=f94e67]:
          - heading "Avantages fidélité" [level=3] [ref=f94e68]
          - paragraph
          - paragraph [ref=f94e69]:
            - text: Gagnez des points en achetant en magasin et en ligne! Notre enseigne Foulées vous propose une carte de fidélité très avantageuse qui vous permet de cumuler rapidement des points et de les convertir en Euros pour en bénéficier sur vos prochains achats. Foulées étant un réseau de magasins indépendants, chaque magasin est libre de proposer ce service ou non et la carte de fidélité est propre à chaque magasin (elle ne permet de cumuler des points valables uniquement dans ce magasin).
            - strong [ref=f94e70]: La souscription de la carte de fidélité n'est possible que en magasin.
            - text: Rendez-vous sur
            - link "votre compte" [ref=f94e71] [cursor=pointer]:
              - /url: /shop/index.php/Compte/GestionCommandes
            - text: dès maintenant pour associer votre carte de fidélité à votre compte internet. Si vous n’avez pas encore la carte de fidélité, demandez là vite dans votre magasin !
          - heading "Achat en magasin :" [level=4] [ref=f94e72]
          - paragraph [ref=f94e73]: Vos achats, hors promotions et soldes, vont vous permettre de cumuler des points de fidélité que vous pouvez utiliser dès que vous le souhaitez dans votre magasin préféré, sous réserve que le magasin propose la carte de fidélité. Un avantage non négligeable car ce cumul de point correspond à une remise moyenne de 5%. Votre fidélité pourra être plus largement récompensée lors de nos opérations commerciales. Chaque magasin peut adopter une politique propre de récompense des achats de ses clients fidélisés, en fonction des produits achetés. Merci de vous renseigner directement auprès du magasin si besoin.
          - heading "Achat en ligne :" [level=4] [ref=f94e74]
          - paragraph [ref=f94e75]: "Vos achats permettent de cumuler des points sur votre carte fidélité uniquement si :"
          - list [ref=f94e76]:
            - listitem [ref=f94e77]: Vous possédez déjà une carte fidélité dans un des magasins et qu'elle est reliée à votre compte client internet
            - listitem [ref=f94e78]: Que vous passez commande en click & Collect auprès de ce magasin ou que vous sélectionnez ce magasin comme magasin référent pour votre commande internet
            - listitem [ref=f94e79]: Que le magasin prévoit l'octroi de points sur ces produits (politique de récompense variable suivant le magasin)
          - text: Chaque magasin peut adopter une politique propre de récompense des achats de ces clients fidélisés, en fonction des produits achetés. Se renseigner directement auprès du magasin si besoin.
          - paragraph
          - heading "Conversion des points en euros :" [level=4] [ref=f94e80]
          - paragraph [ref=f94e81]: "Une conversion facile des points : 1 point = 1 Euro. Les points cumulés ne sont valables que pour une certaine durée et ne sont dépensable que en magasin. Se renseigner auprès de votre magasin si besoin."
          - paragraph
