        - generic [ref=e302]:
          - heading [level=1] [ref=e305]:
            - text: Ekosport
            - strong [ref=e306]: Retourner un produit
          - generic [ref=e308]:
            - generic [ref=e311]:
              - heading "Quels sont les délais et combien coûte le retour d'un article ?" [level=2] [ref=e312]
              - paragraph [ref=e313]: Vous disposez de 30 jours à compter de la réception des produits pour exercer votre droit de rétractation, sans avoir à justifier de motifs ni à payer de pénalités, à l'exception des frais de retour des produits concernés. Toutefois, les frais supplémentaires de livraison résultant de votre choix d'un mode de livraison plus coûteux que le mode de livraison standard proposé par Ekosport lors de la finalisation de votre commande ne sont pas remboursés. Vous pouvez choisir de retourner les articles par vos propres moyens ou d'utiliser une étiquette de retour proposée par Ekosport. Dans le cas d'une étiquette prépayée par Ekosport, le prix de celle-ci sera déduit de votre remboursement. Si vous choisissez de retourner la marchandise par vos propres moyens, les frais de renvoi seront à votre charge.
              - table [ref=e315]:
                - rowgroup [ref=e316]:
                  - row [ref=e317]:
                    - columnheader "Transporteur" [ref=e318]
                    - columnheader "Tarif étiquette de retour" [ref=e319]
                    - columnheader "Délais" [ref=e320]
                    - columnheader "Infos complémentaires" [ref=e321]
                  - row [ref=e322]:
                    - cell "Mondial Relais" [ref=e323]
                    - cell "3,99 €" [ref=e324]
                    - cell "4 à 5 jours" [ref=e325]
                    - cell "Le colis doit être déposé dans un point Mondial Relais" [ref=e326]
                  - row [ref=e327]:
                    - cell "Chronopost" [ref=e328]
                    - cell "4,99 €" [ref=e329]
                    - cell "2 à 3 jours" [ref=e330]
                    - cell "Le colis doit être déposé dans un point relais du réseau Chronopost" [ref=e331]
                  - row [ref=e332]:
                    - cell "Par vos propres moyens" [ref=e333]
                    - cell "(variable)" [ref=e334]
                    - cell "(variable)" [ref=e335]
                    - cell [ref=e336]:
                      - text: Vous choisissez de ne pas utiliser d'étiquettes de retour proposées par Ekosport et de renvoyer la marchandise par vos propres moyens. Les frais de renvoi sont à votre charge. Le colis de retour doit être impérativement livré à notre adresse. Les colis de retour livrés en points relais proches d'Ekosport ne seront pas récupérés par nos équipes et vous seront retournés directement. En cas de litige, seul l’expéditeur, soit le client devra effectuer les démarches auprès du transporteur.
                      - strong [ref=e337]: Vous pouvez également choisir cette option lorsque vous souhaitez déposer le colis de retour dans l'un de nos magasins directement (hors magasin de Gap, Le Pontet, Cabriès, Paris Montparnasse et Paris Madeleine).
              - separator [ref=e338]
              - heading "Où faire ma demande de retour ?" [level=2] [ref=e339]
              - paragraph [ref=e340]: La procédure de retour peut s'effectuer en ligne via votre compte client sur ekosport. Dans la rubrique "Mon compte", cliquez sur l'onglet “Mes commandes”. Sélectionnez le numéro de commande correspondant à votre retour. Puis cliquez-en bas à droite sur “RETOURNER UN PRODUIT”.
              - separator [ref=e341]
              - heading "Quels sont les différents types de retour ?" [level=2] [ref=e342]
              - paragraph [ref=e343]: Pour un traitement rapide de votre demande de retour, nous vous remercions d'être vigilant sur le motif du retour.
              - heading "1/ Retour classique / Droit de rétractation :" [level=3] [ref=e344]
              - paragraph [ref=e345]: "Les raisons de ce retour peuvent être diverses : \"la taille ne me convient pas\", \"je me suis trompé(e)\", \"je souhaite exercer mon droit de rétractation\". La marchandise doit alors être neuve (jamais portée), avec les étiquettes et emballages d’origine. Conformément à la loi, les produits personnalisés ne peuvent pas être retournés."
              - generic [ref=e346]:
                - paragraph [ref=e347]:
                  - strong [ref=e348]: "ATTENTION :"
                  - text: "Le droit de rétractation ne s’applique pas dans les cas suivant :"
                - list [ref=e349]:
                  - listitem [ref=e350]: Pour une paire de skis pour laquelle nous devons effectuer un perçage pour le réglage et le montage des fixations (skis personnalisés).
                  - listitem [ref=e351]:
                    - text: Pour les
                    - link "équipements de protection individuelle" [ref=e352] [cursor=pointer]:
                      - /url: /c/gam-GC216-epi
                    - text: ": sac airbag et set de déclenchement, équipements d’escalade et via ferrata (baudrier escalade, mousqueton escalade, bloqueur escalade, dégaine escalade, assureur, descendeur escalade, coinceur escalade, poulie escalade, corderie escalade, corde escalade, longe escalade, cordelette escalade, sangle escalade et kit via ferrata), équipement alpinisme (baudrier alpinisme, crampon alpinisme, piolet alpinisme, corde alpinisme, broche à glace, kit secours crevasse, accessoire crampons et piolet)."
                  - listitem [ref=e353]: "Pour les produits de nutrition : repas déshydratés, aliments et compléments alimentaires"
              - heading "2/ Retour non conforme :" [level=3] [ref=e354]
              - paragraph [ref=e355]: Le produit reçu est différent de celui commandé (erreur de taille, erreur de descriptif, mauvaise couleur, produit incomplet, antivol…).
              - heading "3/ Retour défectueux :" [level=3] [ref=e356]
              - paragraph [ref=e357]: L'article reçu est endommagé ou défectueux (coutures défectueuses, mécanisme défaillant, fermeture éclair coincée ou cassée, rayures…).
              - generic [ref=e358]:
                - paragraph [ref=e359]:
                  - text: Pour les cas 1 vous disposez de
                  - strong [ref=e360]: 30 jours
                  - text: à réception de votre colis pour effectuer votre demande de retour. Pour les cas 2 et 3 vous disposez de
                  - strong [ref=e361]: 14 jours
                  - text: à réception de votre colis.
                  - strong [ref=e362]: Passé ce délai, la marchandise et la livraison sont considérées comme conformes.
                - paragraph [ref=e363]: Dans le cas d'un renvoi, les produits doivent être neufs avec les étiquettes et emballages d'origine.
              - heading "4/ SAV :" [level=3] [ref=e364]
              - paragraph [ref=e365]: À la suite de l'utilisation de votre produit acheté chez ekosport, celui-ci présente une usure anormale ou prématurée (crochet cassé, coutures décousues, problème d'imperméabilité, délaminage…). Vous disposez de 2 ans après votre achat pour déclarer un SAV via ce formulaire.
              - separator [ref=e366]
              - heading "Comment faire mon retour ?" [level=2] [ref=e367]
              - paragraph [ref=e368]: "Veuillez suivre les différentes étapes suivantes pour effectuer votre demande de retour :"
              - list [ref=e369]:
                - listitem [ref=e370]:
                  - strong [ref=e371]: Etape 1
                  - text: ": Sélectionnez le numéro de commande correspondant à votre retour."
                - listitem [ref=e372]:
                  - strong [ref=e373]: Etape 2
                  - text: ": Cliquez-en bas à droite sur “RETOURNER UN PRODUIT, puis complétez votre demande de retour : sélectionnez le motif du retour, la quantité du produit, puis validez.Pour valider un retour \"non conforme\", \"défectueux\" ou \"SAV\", une photo de l'article et un message explicatif du problème rencontré sont obligatoires pour valider la demande."
                - listitem [ref=e374]:
                  - strong [ref=e375]: Etape 3
                  - text: ": Dans le cadre d'un retour classique, choisissez un transporteur pour le renvoi des produits. Vous pouvez choisir de retourner les articles par vos propres moyens ou d'utiliser une étiquette de retour proposée par ekosport. Dans le cas d'une étiquette prépayée par ekosport, le prix de celle-ci sera déduit de votre remboursement. Si vous choisissez de retourner la marchandise par vos propres moyens, les frais de renvoi restent à votre charge."
                - listitem [ref=e376]:
                  - strong [ref=e377]: Etape 4
                  - text: ": Cliquez sur « Envoyer la demande », vous recevrez ensuite par e-mail"
                  - strong [ref=e378]: un accusé de réception de votre demande
                  - text: ", votre numéro de retour ainsi que les informations nécessaires au renvoi de la marchandise."
                - listitem [ref=e379]:
                  - strong [ref=e380]: Etape 5
                  - text: ": Dans le mail de retour, vous disposerez d’un bon de retour marchandise à imprimer et à placer dans le colis. Si vous avez choisi de renvoyer la marchandise grâce à une étiquette prépayée Ekosport, celle-ci sera également en pièce jointe ou alors à télécharger en cliquant sur un lien dans le corps du mail."
                - listitem [ref=e381]:
                  - strong [ref=e382]: Etape 6
                  - text: ": Pour Mondial Relay : déposez le colis dans un point relais Mondial Relay. Pour"
                  - strong [ref=e383]: Chronopost
                  - text: déposez le colis dans un point relais du réseau Chronopost. Dans le cas d’un renvoi par vos propres moyens, choisissez le transporteur de votre choix. Pour déposer votre colis en magasin EKOSPORT, choisissez « retour par mes propres moyens ».
                - listitem [ref=e384]:
                  - strong [ref=e385]: Etape 7
                  - text: ": Nous vous prions de bien conserver la preuve de dépôt de votre colis le temps que celui-ci soit traité par nos services."
              - paragraph [ref=e386]: Lorsque vous retournez les articles par vos propres moyens, vous êtes l’unique garant de la bonne réception de celui-ci au sein de notre entrepôt. Si vous décidez d’envoyer le colis dans un point relais, qu’il soit plus ou moins proche de notre centre logistique, nos équipes ne sont pas tenus de le récupérer. Par conséquent, celui-ci vous sera automatiquement retourné.
              - generic [ref=e387]:
                - paragraph [ref=e388]: "Pour renvoyer la marchandise par vos propres moyens, merci d’adresser votre colis à :"
                - paragraph [ref=e389]:
                  - strong [ref=e390]: EKOSPORT, Service Retours
                - paragraph [ref=e391]:
                  - strong [ref=e392]: 173 rue des Eglantiers
                - paragraph [ref=e393]:
                  - strong [ref=e394]: 73230 Saint Alban Leysse - France
              - paragraph [ref=e396]: Si vous ne recevez pas de mail de retour, merci de vérifier dans vos courriers indésirables (spam). Une fois votre demande envoyée, vérifiez que celle-ci apparaisse bien comme « prise en compte » dans la rubrique “Mes commandes”. Sélectionnez le numéro de commande correspondant à votre retour. Puis cliquez-en bas à droite sur “RETOURNER UN PRODUIT”.
              - paragraph [ref=e397]: A la réception de votre colis par nos services, selon votre choix, vous serez remboursé dans un délai légal maximum de 14 jours par le même mode de paiement que vous avez utilisé pour réaliser votre achat. Vous serez averti par e-mail à la réception de votre colis par nos services.
              - separator [ref=e398]
              - heading "Puis-je déposer mon colis de retour en magasin ?" [level=2] [ref=e399]
              - paragraph [ref=e400]:
                - text: Oui, il est possible de laisser votre colis de retour dans l'un de nos magasins (
                - strong [ref=e401]: sauf ceux de Gap, Paris, Cabriès et Le Pontet
                - text: ).
              - paragraph [ref=e402]: Cependant, le magasin fait seulement office de dépôt. Il ne pourra ni vous rembourser, ni effectuer un échange. Votre commande ayant été effectuée sur notre site internet, le retour de votre produit sera traité par le service logistique du site web.
              - paragraph [ref=e403]:
                - text: Pour retourner votre commande en magasin, rendez-vous dans “Mes commandes”. Sélectionnez le numéro de commande correspondant à votre retour. Puis cliquez-en bas à droite sur “RETOURNER UN PRODUIT”. Renseignez la quantité, le motif, sélectionnez remboursement et pour le renvoi choisissez "
                - strong [ref=e404]: retour par mes propres moyens
                - text: "\". Vous recevrez alors un mail avec un bon de retour à placer à l’intérieur de votre colis, avant de le déposer en magasin."
              - paragraph [ref=e405]: Une fois le colis déposé, le magasin le retourne vers notre entrepôt où il sera vérifié et validé. Vous recevrez alors votre remboursement sur le moyen de paiement utilisé lors de votre commande.
              - paragraph [ref=e406]:
                - text: Nous vous rappelons que nous disposons de
                - strong [ref=e407]: 14 jours
                - text: une fois le colis déposé au magasin pour vous rembourser.
