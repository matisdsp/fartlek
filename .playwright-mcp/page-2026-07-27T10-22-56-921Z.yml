      - group [ref=f3e143]:
        - generic "Description" [ref=f3e144] [cursor=pointer]
        - paragraph [ref=f3e145]:
          - text: Conçue pour les coureurs en quête de vitesse et de légèreté sur route, la
          - strong [ref=f3e146]: ASICS SUPERBLAST 3
          - text: repousse les limites du running quotidien grâce à des technologies directement héritées des modèles de compétition.
        - paragraph [ref=f3e147]:
          - text: Sa semelle intermédiaire enrichie d'une
          - strong [ref=f3e148]: mousse FF LEAP
          - text: ", inspirée de la gamme METASPEED, offre un"
          - strong [ref=f3e149]: retour d'énergie exceptionnel
          - text: à chaque foulée. Avec seulement 239 grammes sur la balance, elle figure parmi les
          - strong [ref=f3e150]: chaussures maximalistes les plus légères du marché
          - text: ", idéale aussi bien pour les entraînements que pour les courses sur bitume."
        - paragraph [ref=f3e151]:
          - text: Une capsule à effet trampoline, stratégiquement intégrée dans la semelle extérieure, booste la réactivité et propulse chaque impulsion avec une énergie décuplée. Polyvalente et unisexe, la
          - strong [ref=f3e152]: ASICS SUPERBLAST 3
          - text: est la compagne parfaite des runners exigeants qui veulent aller plus vite, plus longtemps, sans sacrifier le confort.
        - heading "Caractéristiques techniques" [level=3] [ref=f3e153]
        - list [ref=f3e154]:
          - listitem [ref=f3e155]:
            - strong [ref=f3e156]: "Poids :"
            - text: 239 g
          - listitem [ref=f3e157]:
            - strong [ref=f3e158]: "Drop :"
            - text: 8 mm
          - listitem [ref=f3e159]:
            - strong [ref=f3e160]: "Stabilité :"
            - text: Bonne
          - listitem [ref=f3e161]:
            - strong [ref=f3e162]: "Amorti :"
            - text: Excellent
          - listitem [ref=f3e163]:
            - strong [ref=f3e164]: "Dynamisme :"
            - text: Excellent
        - heading "Technologies" [level=3] [ref=f3e165]
        - paragraph [ref=f3e166]:
          - strong [ref=f3e167]: FF LEAP
          - text: ": Nouvelle mousse de semelle intermédiaire issue des modèles de compétition METASPEED, légère et hautement réactive pour un rendement énergétique maximal à chaque appui."
        - paragraph [ref=f3e168]:
          - strong [ref=f3e169]: Capsule à effet trampoline
          - text: ": Élément innovant intégré dans la semelle extérieure qui amplifie la réactivité et génère une impulsion ultra-dynamique, pour une foulée propulsive et fluide."
        - paragraph [ref=f3e170]:
          - strong [ref=f3e171]: Amorti élevé
          - text: ": Hauteur de semelle généreuse qui absorbe efficacement les chocs sur bitume, protégeant les articulations sur les longues distances."
        - paragraph [ref=f3e172]:
          - strong [ref=f3e173]: Plateforme unisexe
          - text: ": Conçue pour s'adapter aussi bien aux hommes qu'aux femmes, pour un maintien optimal et un confort immédiat dès la première sortie."
        - paragraph [ref=f3e174]:
          - text: Que vous prépariez un marathon, un semi ou que vous cherchiez simplement à pimenter vos sorties du quotidien, la
          - strong [ref=f3e175]: ASICS SUPERBLAST 3
          - text: est la chaussure qui transforme chaque kilomètre en plaisir. Ne passez pas à côté de cette nouvelle référence et ressentez la différence à la première foulée !
